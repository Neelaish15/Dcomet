# Simple 4-Bus Grid Profile
# For 10W prototype demo

buses:
  bus_1:
    name: "Grid Connection (11 kV)"
    vn_kv: 11
    type: "ext_grid"
    vm_pu: 1.0
    
  bus_2:
    name: "Main Load (11 kV)"
    vn_kv: 11
    type: "load"
    
  bus_3:
    name: "Transformer HV (11 kV)"
    vn_kv: 11
    type: "intermediate"
    
  bus_4:
    name: "Transformer LV (415V/12V)"
    vn_kv: 0.415
    type: "load_der"

lines:
  line_1_2:
    from_bus: "bus_1"
    to_bus: "bus_2"
    length_km: 1
    r_ohm_per_km: 0.5
    x_ohm_per_km: 0.1
    max_i_ka: 1
    name: "Line 1-2"
    
  line_2_3:
    from_bus: "bus_2"
    to_bus: "bus_3"
    length_km: 5
    r_ohm_per_km: 0.5
    x_ohm_per_km: 0.1
    max_i_ka: 1
    name: "Line 2-3"

transformers:
  trafo_3_4:
    hv_bus: "bus_3"
    lv_bus: "bus_4"
    sn_mva: 2.0
    vn_hv_kv: 11
    vn_lv_kv: 0.415
    vk_percent: 6
    vkr_percent: 1.0
    pfe_kw: 0.1
    i0_percent: 0.1
    name: "11kV/415V Transformer"

loads:
  load_bus_2:
    bus: "bus_2"
    p_mw: 5.0
    q_mvar: 0.5
    name: "Load at Bus 2"
    
  load_bus_4:
    bus: "bus_4"
    p_mw: 1.0
    q_mvar: 0.1
    name: "Load at Bus 4"

ext_grid:
  grid_bus_1:
    bus: "bus_1"
    vm_pu: 1.0
    name: "DSO Grid Connection"
